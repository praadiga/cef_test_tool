<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Calls — L-Band</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            background: transparent;
            font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
        }

        /* Classic news L-band: vertical ad strip + bottom ticker bar */
        .l-vertical {
            position: absolute;
            left: 0;
            top: 0;
            width: 340px;
            height: calc(100% - 112px);
            background: linear-gradient(180deg, rgba(8, 12, 28, 0.94) 0%, rgba(18, 24, 48, 0.92) 100%);
            border-right: 3px solid #e11d48;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .l-vertical-header {
            padding: 14px 16px 10px;
            background: #e11d48;
            color: #fff;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .ad-frame {
            flex: 1;
            margin: 12px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .ad-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .ad-placeholder {
            color: #94a3b8;
            font-size: 18px;
            text-align: center;
            padding: 20px;
            line-height: 1.4;
        }

        .ad-meta {
            padding: 8px 14px 12px;
            font-size: 13px;
            color: #94a3b8;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .l-horizontal {
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            height: 112px;
            background: rgba(0, 0, 0, 0.82);
            border-top: 3px solid #e11d48;
            display: flex;
            align-items: stretch;
        }

        .weather-badge {
            width: 220px;
            flex-shrink: 0;
            background: #e11d48;
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 18px;
            font-weight: 800;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .weather-badge span {
            font-size: 14px;
            opacity: 0.9;
            font-weight: 600;
        }

        .weather-badge strong {
            font-size: 26px;
            margin-top: 4px;
        }

        .ticker-wrap {
            flex: 1;
            overflow: hidden;
            display: flex;
            align-items: center;
            position: relative;
        }

        .ticker-track {
            display: inline-block;
            white-space: nowrap;
            padding-left: 100%;
            font-size: 36px;
            font-weight: 600;
            color: #f8fafc;
            line-height: 112px;
            animation: scroll-ticker 45s linear infinite;
        }

        @keyframes scroll-ticker {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }

        .status-pill {
            position: absolute;
            top: 12px;
            right: 16px;
            font-size: 12px;
            color: #64748b;
            background: rgba(15, 23, 42, 0.75);
            padding: 6px 10px;
            border-radius: 6px;
            font-family: "SFMono-Regular", Consolas, monospace;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="status-pill" class="status-pill">loading…</div>
    <audio id="network-audio" autoplay loop preload="auto">
        <source src="{{ audio_url }}" type="audio/mpeg">
    </audio>

    <aside class="l-vertical">
        <div class="l-vertical-header">Sponsored</div>
        <div class="ad-frame" id="ad-frame">
            <div class="ad-placeholder" id="ad-placeholder">Waiting for /random-image…</div>
            <img id="ad-image" alt="Sponsored" hidden />
        </div>
        <div class="ad-meta" id="ad-meta">Image: —</div>
    </aside>

    <footer class="l-horizontal">
        <div class="weather-badge">
            <span>Astro forecast</span>
            <strong id="weather-headline">—</strong>
        </div>
        <div class="ticker-wrap">
            <div class="ticker-track" id="weather-ticker">Fetching weather from 7timer…</div>
        </div>
    </footer>

    <script>
        const CLOUD_LABELS = ['Clear', 'Mostly clear', 'Partly cloudy', 'Mostly cloudy', 'Overcast', 'Very cloudy', 'Extremely cloudy', 'Overcast', 'Fog'];
        const SEEING_LABELS = ['Poor', 'Poor', 'Average', 'Good', 'Excellent'];

        const adImage = document.getElementById('ad-image');
        const adPlaceholder = document.getElementById('ad-placeholder');
        const adMeta = document.getElementById('ad-meta');
        const weatherHeadline = document.getElementById('weather-headline');
        const weatherTicker = document.getElementById('weather-ticker');
        const statusPill = document.getElementById('status-pill');
        const networkAudio = document.getElementById('network-audio');

        let config = {
            random_image_status: 200,
            weather_interval_ms: 150000,
            random_image_interval_ms: 300000,
        };
        let weatherTimer = null;
        let imageTimer = null;
        let configKey = '';
        let lastImageAt = null;
        let lastWeatherAt = null;
        let audioState = 'pending';
        let logSeq = 0;

        function logNetwork(level, event, details) {
            logSeq += 1;
            const message = '[CEF_TEST] [network-calls] [' + level + '] seq=' + logSeq
                + ' event=' + event
                + ' t=' + Date.now()
                + (details ? ' ' + details : '');
            if (level === 'ERROR') {
                console.error(message);
            } else if (level === 'WARN') {
                console.warn(message);
            } else {
                console.info(message);
            }
        }

        function audioLog(level, status, details) {
            logNetwork(
                level,
                'audio_status',
                'status=' + status
                    + ' url=' + JSON.stringify(networkAudio.currentSrc || networkAudio.querySelector('source').src)
                    + (details ? ' ' + details : '')
            );
        }

        function startRandomDiagnosticLogs() {
            const messages = [
                'simulated cache pressure during ad refresh',
                'simulated slow image decode path',
                'simulated weather payload validation warning',
                'simulated transient media/network diagnostic',
                'simulated CEF render-process diagnostic marker',
            ];

            function emit() {
                const isError = Math.random() < 0.35;
                const level = isError ? 'ERROR' : 'WARN';
                const event = isError ? 'random_diag_error' : 'random_diag_warning';
                const message = messages[Math.floor(Math.random() * messages.length)];
                logNetwork(
                    level,
                    event,
                    'message=' + JSON.stringify(message)
                        + ' audio_state=' + audioState
                        + ' random_image_status=' + config.random_image_status
                );
                setTimeout(emit, 3000 + Math.floor(Math.random() * 5000));
            }

            emit();
        }

        function cloudLabel(code) {
            const idx = parseInt(code, 10);
            if (!Number.isFinite(idx) || idx < 0) return 'Unknown';
            return CLOUD_LABELS[Math.min(idx, CLOUD_LABELS.length - 1)] || 'Unknown';
        }

        function seeingLabel(code) {
            const idx = parseInt(code, 10);
            if (!Number.isFinite(idx) || idx < 1) return '—';
            return SEEING_LABELS[Math.min(idx, SEEING_LABELS.length - 1)] || '—';
        }

        function formatTime(date) {
            return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }

        function updateStatusPill() {
            const img = lastImageAt ? formatTime(lastImageAt) : '—';
            const wx = lastWeatherAt ? formatTime(lastWeatherAt) : '—';
            statusPill.textContent = 'img ' + img
                + ' · wx ' + wx
                + ' · audio ' + audioState
                + ' · /random-image=' + config.random_image_status;
        }

        function attemptAudioAutoplay() {
            if (!networkAudio) return;
            logNetwork('INFO', 'audio_autoplay_start', 'url=' + (networkAudio.currentSrc || networkAudio.querySelector('source').src));
            const playPromise = networkAudio.play();
            if (!playPromise || typeof playPromise.then !== 'function') {
                audioState = networkAudio.paused ? 'blocked' : 'playing';
                logNetwork('INFO', 'audio_autoplay_result', 'state=' + audioState);
                updateStatusPill();
                return;
            }
            playPromise
                .then(() => {
                    audioState = 'playing';
                    audioLog('INFO', 'PLAYING', 'reason=autoplay_ok muted=' + networkAudio.muted + ' loop=' + networkAudio.loop);
                    updateStatusPill();
                })
                .catch((err) => {
                    audioState = 'blocked';
                    audioLog(
                        'WARN',
                        'FAILED',
                        'reason=autoplay_blocked error=' + JSON.stringify(String(err && err.message ? err.message : err))
                    );
                    updateStatusPill();
                });
        }

        function normalizeConfig(raw) {
            const c = raw && typeof raw === 'object' ? raw : {};
            const status = parseInt(c.random_image_status, 10);
            const weatherMs = parseInt(c.weather_interval_ms, 10);
            const imageMs = parseInt(c.random_image_interval_ms, 10);
            return {
                random_image_status: status === 500 ? 500 : 200,
                weather_interval_ms: Number.isFinite(weatherMs) && weatherMs >= 1000 ? weatherMs : 150000,
                random_image_interval_ms: Number.isFinite(imageMs) && imageMs >= 1000 ? imageMs : 300000,
            };
        }

        function summarizeWeather(data) {
            const series = data && Array.isArray(data.dataseries) ? data.dataseries : [];
            if (!series.length) return { headline: 'No data', ticker: '7timer returned no forecast points.' };
            const next = series.slice(0, 6);
            const headline = cloudLabel(next[0].cloudcover);
            const parts = next.map((point) => {
                const hours = point.timepoint;
                return '+' + hours + 'h ' + cloudLabel(point.cloudcover)
                    + ' · seeing ' + seeingLabel(point.seeing)
                    + (point.temp2m != null ? ' · ' + point.temp2m + '°C' : '');
            });
            const ticker = parts.join('   •   ') + '   •   ';
            return { headline: headline, ticker: ticker };
        }

        async function fetchWeather() {
            const startedAt = performance.now();
            logNetwork('INFO', 'weather_fetch_start', 'url=/api/weather');
            try {
                const res = await fetch('/api/weather');
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
                const summary = summarizeWeather(data);
                weatherHeadline.textContent = summary.headline;
                weatherTicker.textContent = summary.ticker;
                lastWeatherAt = new Date();
                updateStatusPill();
                logNetwork(
                    'INFO',
                    'weather_fetch_ok',
                    'status=' + res.status
                        + ' duration_ms=' + Math.round(performance.now() - startedAt)
                        + ' points=' + ((data.dataseries && data.dataseries.length) || 0)
                );
            } catch (err) {
                weatherHeadline.textContent = 'Error';
                weatherTicker.textContent = 'Weather fetch failed: ' + (err.message || err) + '   •   ';
                logNetwork(
                    'ERROR',
                    'weather_fetch_failed',
                    'duration_ms=' + Math.round(performance.now() - startedAt)
                        + ' error=' + JSON.stringify(String(err && err.message ? err.message : err))
                );
            }
        }

        function fetchRandomImage() {
            const requestedAt = Date.now();
            logNetwork('INFO', 'image_fetch_start', 'url=/random-image configured_status=' + config.random_image_status);
            adMeta.textContent = 'Image: fetching…';
            adImage.onload = () => {
                adImage.hidden = false;
                adPlaceholder.hidden = true;
                lastImageAt = new Date();
                adMeta.textContent = 'Image: /random-image · ' + formatTime(lastImageAt);
                updateStatusPill();
                logNetwork('INFO', 'image_fetch_ok', 'duration_ms=' + (Date.now() - requestedAt));
            };
            adImage.onerror = () => {
                adImage.hidden = true;
                adPlaceholder.hidden = false;
                adPlaceholder.textContent = '/random-image failed (HTTP ' + config.random_image_status + ')';
                adMeta.textContent = 'Image: error';
                logNetwork(
                    'ERROR',
                    'image_fetch_failed',
                    'duration_ms=' + (Date.now() - requestedAt)
                        + ' configured_status=' + config.random_image_status
                );
            };
            adImage.src = '/random-image?t=' + Date.now();
        }

        function restartTimers() {
            if (weatherTimer) clearInterval(weatherTimer);
            if (imageTimer) clearInterval(imageTimer);
            fetchWeather();
            fetchRandomImage();
            weatherTimer = setInterval(fetchWeather, config.weather_interval_ms);
            imageTimer = setInterval(fetchRandomImage, config.random_image_interval_ms);
            updateStatusPill();
        }

        function applyConfig(raw) {
            const next = normalizeConfig(raw);
            const key = JSON.stringify(next);
            const intervalsChanged = key !== configKey;
            config = next;
            configKey = key;
            updateStatusPill();
            if (intervalsChanged) {
                logNetwork(
                    'INFO',
                    'config_changed',
                    'random_image_status=' + config.random_image_status
                        + ' weather_interval_ms=' + config.weather_interval_ms
                        + ' random_image_interval_ms=' + config.random_image_interval_ms
                );
                restartTimers();
            }
        }

        async function loadInitialState() {
            logNetwork('INFO', 'initial_state_fetch_start', 'url=/api/overlay');
            const res = await fetch('/api/overlay');
            if (!res.ok) throw new Error('GET /api/overlay failed');
            const state = await res.json();
            applyConfig(state.network_calls);
            logNetwork('INFO', 'initial_state_fetch_ok', 'status=' + res.status);
        }

        function connectStream() {
            if (!window.EventSource) return;
            const stream = new EventSource('/api/stream');
            stream.onmessage = (event) => {
                try {
                    const state = JSON.parse(event.data);
                    logNetwork('INFO', 'sse_state_received', 'has_network_calls=' + !!state.network_calls);
                    applyConfig(state.network_calls);
                } catch (err) {
                    logNetwork(
                        'WARN',
                        'sse_bad_payload',
                        'error=' + JSON.stringify(String(err && err.message ? err.message : err))
                    );
                }
            };
        }

        loadInitialState()
            .then(connectStream)
            .then(attemptAudioAutoplay)
            .then(startRandomDiagnosticLogs)
            .catch((err) => {
                console.error('[network-calls] init failed', err);
                statusPill.textContent = 'init failed';
            });

        networkAudio.addEventListener('playing', () => {
            audioState = 'playing';
            audioLog('INFO', 'PLAYING', 'reason=playing_event current_time=' + networkAudio.currentTime.toFixed(2));
            updateStatusPill();
        });
        networkAudio.addEventListener('pause', () => {
            audioState = 'paused';
            audioLog('WARN', 'FAILED', 'reason=paused current_time=' + networkAudio.currentTime.toFixed(2));
            updateStatusPill();
        });
        networkAudio.addEventListener('ended', () => {
            audioState = 'ended';
            audioLog('WARN', 'FAILED', 'reason=ended');
            updateStatusPill();
        });
        networkAudio.addEventListener('error', () => {
            audioState = 'error';
            const err = networkAudio.error;
            audioLog(
                'ERROR',
                'FAILED',
                'reason=source_error network_state=' + networkAudio.networkState
                    + ' error_code=' + (err ? err.code : 'unknown')
            );
            updateStatusPill();
        });
    </script>
</body>
</html>
